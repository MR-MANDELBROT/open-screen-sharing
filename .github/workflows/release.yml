name: Release

on:
  workflow_dispatch:

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
        with:
          fetch-depth: 0
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Release
        run: |-
          gh release download nightly -D build -p OpenScreenSharing.ipa -p OpenScreenSharing.pkg -p 'OpenScreenSharing-*.dSYMs.zip' -p metadata.json -p icon.png
          if [ "$(jq .build build/metadata.json)" != "$(git tag -l --format='%(contents:subject)' nightly)" ]; then
            echo "nightly was updated during the release, run it again" >&2
            exit 1
          fi
          TAG=v$(jq -r .version build/metadata.json)
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "$TAG already exists" >&2
            exit 1
          fi
          if PREVIOUS=$(gh release view --json tagName --jq .tagName); then
            NOTES=$(git log --format='* %s' "$PREVIOUS..nightly")
          else
            NOTES=$(git log --format='* %s' nightly)
          fi
          go run ./cmd/internal/build_altstore_source -tag "$TAG"
          gh release create "$TAG" --draft --target "$(git rev-parse 'nightly^{commit}')" --notes "$NOTES" \
            build/OpenScreenSharing.ipa build/OpenScreenSharing.pkg build/OpenScreenSharing-iOS.dSYMs.zip build/OpenScreenSharing-macOS.dSYMs.zip \
            build/metadata.json build/icon.png build/altstore/altstore.json
        env:
          GH_TOKEN: ${{ github.token }}
